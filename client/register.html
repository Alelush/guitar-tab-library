<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - GuitarTabs</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="/" class="logo">GuitarTabs</a>
            <div class="nav-links">
                <a href="/login.html">Войти</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h1>Создать аккаунт</h1>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <!-- Дополнительное поле для выбора роли -->
                <div class="form-group">
                    <label for="role">Я хочу быть:</label>
                    <select id="role" name="role">
                        <option value="user" selected>Обычным пользователем</option>
                        <option value="creator">Создателем табулатур</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <p id="error-message" class="error-text"></p>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
